<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include banner.html %}
  {% include header.html %}

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {%- if page.scripts %}
    {%- for s in page.scripts %}
  <script src="{{ s | relative_url }}" defer></script>
    {%- endfor %}
  {%- endif %}
</body>
</html>
